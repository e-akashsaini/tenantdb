name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet, format, tests (-race)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TENANTDB_TEST_DSN: postgres://postgres:pw@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: proxy/go.mod
          cache-dependency-path: proxy/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: tests
        run: go test -race -count=1 ./...

  fuzz:
    name: differential fuzzing against PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TENANTDB_TEST_DSN: postgres://postgres:pw@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: proxy/go.mod
          cache-dependency-path: proxy/go.sum
      - name: random statements, run for real, compared with what was claimed
        run: |
          for seed in 101 102 103 104; do
            TENANTDB_FUZZ_N=6000 TENANTDB_FUZZ_SEED=$seed go test -count=1 -run 'TestDifferential|TestCopyParserAgreesWithPostgres|TestSessionFuzz' ./internal/attrib
          done

  e2e:
    name: end to end (config, logs, metrics, graceful shutdown)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: proxy/go.mod
          cache-dependency-path: proxy/go.sum
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash bench/ops/e2e.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: pw

  vuln:
    name: govulncheck
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: proxy/go.mod
          cache-dependency-path: proxy/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: the image builds and starts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          build-args: COMMIT=${{ github.sha }}
          tags: tenantdb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: it runs
        run: docker run --rm tenantdb:ci -version
