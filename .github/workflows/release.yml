name: release

# Push a tag such as v0.2.0 to publish: binaries for linux and macOS, a container
# image, SHA-256 checksums and an SBOM, all signed keylessly with cosign through
# this repository's GitHub Actions identity.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04,     goos: linux,  goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux,  goarch: arm64 }
          - { runner: macos-15-intel,         goos: darwin, goarch: amd64 }
          - { runner: macos-14,         goos: darwin, goarch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: proxy/go.mod
          cache-dependency-path: proxy/go.sum
      - name: build
        working-directory: proxy
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o ../dist/tenantdb ./cmd/tenantdb
          cd ../dist
          NAME=tenantdb_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}
          mkdir "$NAME"
          cp tenantdb ../README.md ../CHANGELOG.md ../SECURITY.md "$NAME"/
          cp ../docs/OPERATIONS.md "$NAME"/
          tar -czf "$NAME.tar.gz" "$NAME"
          rm -rf "$NAME" tenantdb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz

  publish:
    name: checksums, SBOM, signatures, GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: proxy
          format: spdx-json
          output-file: dist/tenantdb_${{ github.ref_name }}_sbom.spdx.json
          upload-artifact: false
      - name: checksums and signatures
        working-directory: dist
        run: |
          sha256sum *.tar.gz *.spdx.json > SHA256SUMS
          for f in SHA256SUMS *.tar.gz *.spdx.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -l
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Verify a download: \`cosign verify-blob --bundle FILE.sigstore.json --certificate-identity-regexp 'https://github.com/${{ github.repository }}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com FILE\`, then \`sha256sum -c SHA256SUMS\`."

  image:
    name: container image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: sign the image
        run: cosign sign --yes "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"
